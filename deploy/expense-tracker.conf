# Apache Virtual Host for Expense Tracker
# Ubuntu/Debian: /etc/apache2/sites-available/expense-tracker.conf
# RHEL/Rocky:    /etc/httpd/conf.d/expense-tracker.conf
#
# Assumes the app lives in /var/www/expense-tracker and PHP runs via mod_php.
# For PHP-FPM, see the commented block at the bottom.

<VirtualHost *:80>
    ServerName expense-tracker.local
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/expense-tracker
    DirectoryIndex index.php

    <Directory /var/www/expense-tracker>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Internal folders must never be served directly.
    <DirectoryMatch "^/var/www/expense-tracker/(config|includes|database|deploy)">
        Require all denied
    </DirectoryMatch>

    # Hidden files (.env, .htaccess, .git) and setup/backup files.
    <FilesMatch "^\.|\.(sql|ini|log|bak|example|md|conf)$">
        Require all denied
    </FilesMatch>

    # Optional: provide DB credentials here instead of config/.env
    # (environment variables take precedence over config/.env).
    # SetEnv DB_HOST localhost
    # SetEnv DB_NAME expense_tracker
    # SetEnv DB_USER expense_user
    # SetEnv DB_PASSWORD your_password

    # Basic security headers (requires mod_headers).
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Per-site PHP settings (mod_php only).
    <IfModule mod_php.c>
        php_flag  display_errors Off
        php_flag  log_errors On
        php_value session.cookie_httponly 1
        php_value session.use_strict_mode 1
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/expense-tracker-error.log
    CustomLog ${APACHE_LOG_DIR}/expense-tracker-access.log combined
</VirtualHost>

# --- PHP-FPM alternative (instead of mod_php) ---------------------------------
# Enable: a2enmod proxy_fcgi setenvif && a2enconf php8.3-fpm
# Then add inside <VirtualHost>:
#
#   <FilesMatch "\.php$">
#       SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
#   </FilesMatch>
#
# With FPM, put PHP settings in /etc/php/8.3/fpm/php.ini (php_flag/php_value are ignored).
